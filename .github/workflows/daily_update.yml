name: Daily DAM MCP update

on:
  schedule:
    # 15:00 UTC ~ 17:00-18:00 local time in Greece (EEST/EET, cron has no DST
    # awareness). Chosen to run comfortably after EnEx typically publishes
    # the day's DAM results; the script is a no-op if the file isn't out yet
    # or the date is already stored, so a slightly late run is harmless.
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's DAM prices
        run: python -m enex_dam.scripts.daily_update

      - name: Check for missing/incomplete days
        run: python -m enex_dam.scripts.check_missing || true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Commit the fetched prices before touching the dashboard, so a bug in
      # (or missing input data for) the dashboard build can never again cost
      # us a day's MCP data - see the 2026-10 outage, where a dashboard crash
      # blocked this commit for several days in a row.
      - name: Commit updated dataset
        run: |
          git add data/mcp_full.csv
          git diff --cached --quiet || git commit -m "chore: update DAM MCP data ($(date -u +%F))"
          git push

      - name: Rebuild dashboard
        id: dashboard
        continue-on-error: true
        run: python -m enex_dam.scripts.build_dashboard

      - name: Commit updated dashboard
        if: steps.dashboard.outcome == 'success'
        run: |
          git add docs/index.html
          git diff --cached --quiet || git commit -m "chore: update dashboard ($(date -u +%F))"
          git push

      - name: Fail the run if the dashboard build failed
        if: steps.dashboard.outcome == 'failure'
        run: |
          echo "::error::Dashboard build failed - MCP data was still committed, but docs/index.html is stale. See the 'Rebuild dashboard' step above."
          exit 1
