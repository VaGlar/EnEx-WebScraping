name: Backfill DAM MCP data

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date (YYYY-MM-DD)"
        required: false
        default: "2026-01-01"
      end:
        description: "End date (YYYY-MM-DD), defaults to today"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill
        run: |
          END="${{ inputs.end }}"
          if [ -z "$END" ]; then
            python -m enex_dam.scripts.bulk_download --start "${{ inputs.start }}" --verbose
          else
            python -m enex_dam.scripts.bulk_download --start "${{ inputs.start }}" --end "$END" --verbose
          fi

      - name: Check for missing/incomplete days
        run: python -m enex_dam.scripts.check_missing || true

      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mcp_full.csv
          git diff --cached --quiet || git commit -m "chore: backfill DAM MCP data (${{ inputs.start }} to ${{ inputs.end }})"
          git push
